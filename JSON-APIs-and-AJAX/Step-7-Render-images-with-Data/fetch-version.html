<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Photo Finder</title>
  </head>

  <body>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("getMessage").onclick = function () {
          // fetch() makes the GET request.
          // Unlike XMLHttpRequest, we don't need to create
          // a separate request object or call .open()/.send().
          fetch("./json/cats.json")
            // The first .then() receives the server response.
            // response.json() converts the JSON response
            // into a JavaScript array/object.
            .then(function (response) {
              return response.json();
            })

            // The second .then() receives the actual JavaScript data.
            .then(function (json) {
              let html = "";

              // Loop through each cat in the JSON data.
              json.forEach(function (val) {
                html += "<div class='cat'>";

                // Create an image using the data from the API.
                html +=
                  "<img src='" +
                  val.imageLink +
                  "' " +
                  "alt='" +
                  val.altText +
                  "'>";

                html += "</div><br>";
              });

              // Put the generated HTML into the message element.
              document.getElementsByClassName("message")[0].innerHTML = html;
            });
        };
      });
    </script>

    <style>
      body {
        text-align: center;
        font-family: "Helvetica", sans-serif;
      }

      h1 {
        font-size: 2em;
        font-weight: bold;
      }

      .box {
        border-radius: 5px;
        background-color: #eee;
        padding: 20px 5px;
      }

      button {
        color: white;
        background-color: #4791d0;
        border-radius: 5px;
        border: 1px solid #4791d0;
        padding: 5px 10px 8px 10px;
      }

      button:hover {
        background-color: #0f5897;
        border: 1px solid #0f5897;
      }
    </style>

    <h1>Cat Photo Finder</h1>

    <p class="message box">The message will go here</p>

    <p>
      <button id="getMessage">Get Message</button>
    </p>
  </body>
</html>
