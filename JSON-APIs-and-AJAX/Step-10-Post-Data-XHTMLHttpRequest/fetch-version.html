<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Friends</title>
  </head>

  <body>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("sendMessage").onclick = function () {
          // Get the value the user entered into the input.
          const userName = document.getElementById("name").value;

          // The API endpoint we are sending our POST request to.
          const url = "https://jsonplaceholder.typicode.com/posts";

          // Create the data we want to send to the server.
          const body = JSON.stringify({
            userName: userName,
            suffix: " loves cats!",
          });

          // fetch() can make POST requests by providing
          // a second argument containing configuration options.
          fetch(url, {
            // Tell fetch() that this is a POST request.
            method: "POST",

            // Tell the server that we are sending JSON data.
            headers: {
              "Content-Type": "application/json; charset=UTF-8",
            },

            // Convert our JavaScript object into a JSON string
            // and send it as the request body.
            body: body,
          })
            // The first .then() receives the server response.
            // response.json() converts the response into
            // a JavaScript object.
            .then(function (response) {
              return response.json();
            })

            // The second .then() receives the actual
            // JavaScript object returned by the server.
            .then(function (serverResponse) {
              // Display the response from the server.
              document.getElementsByClassName("message")[0].textContent =
                serverResponse.userName + serverResponse.suffix;
            });
        };
      });
    </script>

    <style>
      body {
        text-align: center;
        font-family: "Helvetica", sans-serif;
      }

      h1 {
        font-size: 2em;
        font-weight: bold;
      }

      .box {
        border-radius: 5px;
        background-color: #eee;
        padding: 20px 5px;
      }

      button {
        color: white;
        background-color: #4791d0;
        border-radius: 5px;
        border: 1px solid #4791d0;
        padding: 5px 10px 8px 10px;
      }

      button:hover {
        background-color: #0f5897;
        border: 1px solid #0f5897;
      }
    </style>

    <h1>Cat Friends</h1>

    <p class="message box">Reply from Server will be here</p>

    <p>
      <label for="name">
        Your name:
        <input type="text" id="name" />
      </label>

      <button id="sendMessage">Send Message</button>
    </p>
  </body>
</html>
