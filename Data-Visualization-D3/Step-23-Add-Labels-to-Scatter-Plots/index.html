<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../d3.v7.js"></script>
    <title>Document</title>
  </head>
  <style>
    svg {
      background-color: pink;
      margin: 20px;
      padding: 20px 0px 0px 0px;
    }

    .bar:hover {
      fill: brown;
    }
  </style>
  <body>
    <script>
      const dataset = [
        [34, 78],
        [109, 280],
        [310, 120],
        [79, 411],
        [420, 220],
        [233, 145],
        [333, 96],
        [222, 333],
        [78, 320],
        [21, 123],
      ];

      const w = 500;
      const h = 500;

      const svg = d3
        .select("body")
        .append("svg")
        .attr("width", w)
        .attr("height", h);

      svg
        .selectAll("circle")
        .data(dataset)
        .enter()
        .append("circle")
        .attr("cx", (d, i) => d[0])
        .attr("cy", (d, i) => h - d[1])
        .attr("r", 5);

      svg
        .selectAll("text")
        .data(dataset)
        .enter()
        .append("text")
        // Add your code below this line
        .attr("x", (d, i) => d[0] + 5)
        .attr("y", (d, i) => h - d[1])
        .text((d) => d[0] + ", " + d[1]);

      // Add your code above this line
    </script>
  </body>
</html>
