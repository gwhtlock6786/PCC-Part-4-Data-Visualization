<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../d3.v7.js"></script>
    <title>Document</title>
  </head>
  <style>
    svg {
      background-color: pink;
      margin: 20px;
      padding: 20px 0px 0px 0px;
    }

    .bar:hover {
      fill: brown;
    }
  </style>
  <body>
    <script>
      const dataset = [12, 31, 22, 17, 25, 18, 29, 14, 9];

      const w = 500;
      const h = 125;

      const svg = d3
        .select("body")
        .append("svg")
        .attr("width", w)
        .attr("height", h);

      svg
        .selectAll("rect")
        .data(dataset)
        .enter()
        .append("rect")
        .attr("x", (d, i) => i * 30)
        .attr("y", (d, i) => h - 3 * d)
        .attr("width", 25)
        .attr("height", (d, i) => d * 3)
        .attr("fill", "navy")
        // Add your code below this line
        .attr("class", "bar");

      // Add your code above this line

      svg
        .selectAll("text")
        .data(dataset)
        .enter()
        .append("text")
        .attr("x", (d, i) => i * 30 + 12.5)
        .attr("y", (d, i) => h - 3 * d - 5)
        .attr("text-anchor", "middle")
        .text((d) => d)
        // Add your code below this line

        .attr("fill", "red")
        .style("font-size", "25px");
      // Add your code above this line
    </script>
  </body>
</html>
